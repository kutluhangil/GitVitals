f" style="animation:tw 2.4s ease-in-out 0.9s infinite"/><circle cx="855.2" cy="253" r="0.9" fill="#fff" style="animation:tw 3.2s ease-in-out 1.9s infinite"/><circle cx="699.2" cy="321.3" r="1.4" fill="#fff" style="animation:tw 3.5s ease-in-out 0.3s infinite"/><circle cx="768.9" cy="216.2" r="0.6" fill="#fff" style="animation:tw 3.7s ease-in-out 0.7s infinite"/><circle cx="899.1" cy="221.6" r="1.1" fill="#fff" style="animation:tw 2.2s ease-in-out 0.2s infinite"/><circle cx="780.8" cy="265.1" r="0.9" fill="#fff" style="animation:tw 2.8s ease-in-out 2s infinite"/><circle cx="1101.2" cy="319.9" r="1.1" fill="#fff" style="animation:tw 3.2s ease-in-out 1.4s infinite"/></g>
